apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  - name: gitops-lab-site
    files:
      - index.html=site/index.html
      - styles.css=site/styles.css
      - app.js=site/app.js
generatorOptions:
  disableNameSuffixHash: false
