name: Docker smoke test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build and start website
        run: docker compose up -d --build
      - name: Verify website and static assets
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ | grep -q 'GitOps Lab'; then
              curl --fail --silent --show-error http://127.0.0.1:8080/styles.css > /dev/null
              curl --fail --silent --show-error http://127.0.0.1:8080/app.js > /dev/null
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Show logs if test fails
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --remove-orphans
